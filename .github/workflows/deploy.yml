name: QuranChain™ Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type/select DEPLOY to run the production release'
        required: true
        type: choice
        options:
          - 'NO'
          - 'DEPLOY'
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: quranchain-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.event.inputs.confirm_production == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run required tests
        run: npx vitest run --config tests/vitest.config.mts

      - name: Apply D1 Migrations
        run: echo "y" | npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment completion
        run: echo "Cloudflare deployment command completed successfully"
