name: QuranChain™ Release Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate release candidate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify retired landing pages
        run: npm run verify:landing-pages

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Worker dry run
        run: npx wrangler deploy --dry-run

      - name: Run tests
        run: npm run test:integration

  # Production deployment is intentionally not automatic. This Worker owns
  # broad DarCloud routes and shares a D1 database with the dedicated MeshTalk
  # Worker. Production names, routes, credentials, and remote bindings are not
  # present in this repository. A release operator must supply an independently
  # reviewed configuration after migration and route-ownership checks.
