name: Build Dar Play Apps (public runner)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build eligible internal debug apps
        working-directory: play-apps
        run: gradle assembleMeshtalkDebug assembleQuranchainDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dar-play-internal-debug-apks
          path: play-apps/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
