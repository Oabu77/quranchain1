name: Stripe Portal Security

on:
  pull_request:
    paths:
      - "src/index.ts"
      - "src/security-entry.ts"
      - "wrangler.jsonc"
      - "tests/security/stripe-portal-containment-guard.mjs"
      - ".github/workflows/stripe-portal-security.yml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run provider-free containment guard
        run: node tests/security/stripe-portal-containment-guard.mjs
