name: Cell Tower Header Security

on:
  pull_request:
    paths:
      - "shared/cell-tower.js"
      - "tests/security/cell-tower-header-guard.mjs"
      - ".github/workflows/cell-tower-header-security.yml"
  push:
    paths:
      - "shared/cell-tower.js"
      - "tests/security/cell-tower-header-guard.mjs"
      - ".github/workflows/cell-tower-header-security.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20.x

      - name: Run provider-free header guard
        run: node tests/security/cell-tower-header-guard.mjs
